name: Duplicate Edition Analyzer check

on:
  push:
    paths:
      - "audio-tools/discography-torrent-project/tools/Duplicate Edition Analyzer v*.pyw"
      - ".github/workflows/duplicate-edition-analyzer-check.yml"
  pull_request:
    paths:
      - "audio-tools/discography-torrent-project/tools/Duplicate Edition Analyzer v*.pyw"
      - ".github/workflows/duplicate-edition-analyzer-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile latest analyzer
        shell: python
        run: |
          import re
          import py_compile
          from pathlib import Path

          root = Path("audio-tools/discography-torrent-project/tools")
          files = list(root.glob("Duplicate Edition Analyzer v*.pyw"))
          if not files:
              raise SystemExit("Duplicate Edition Analyzer file not found")

          def version_key(path):
              match = re.search(r"v(\d+)\.(\d+)\.(\d+)\.pyw$", path.name)
              return tuple(map(int, match.groups())) if match else (-1, -1, -1)

          latest = max(files, key=version_key)
          print(f"Compiling {latest}")
          py_compile.compile(str(latest), doraise=True)
